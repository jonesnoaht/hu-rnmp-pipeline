name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff==0.16.2
      - run: ruff check scripts/ tests/ --ignore E402,F401

  test-python:
    runs-on: ubuntu-latest
    needs: lint-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  build-pipeline-image:
    runs-on: ubuntu-latest
    needs: [lint-python, test-python]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/pipeline/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/jonesnoaht/hu-rnmp-pipeline:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-browser-image:
    runs-on: ubuntu-latest
    needs: lint-python
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker/browser
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/jonesnoaht/hu-rnmp-browser:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
