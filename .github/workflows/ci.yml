name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Ruff 0.16 turns on a much larger default rule set. This job was written
      # for the 0.15 defaults (plus the ignores below). Leave the broader
      # cleanup to the pipeline work rather than failing every unrelated PR.
      - run: pip install ruff==0.15.22
      - run: ruff check scripts/ --ignore E402,F401

  build-pipeline-image:
    runs-on: ubuntu-latest
    needs: lint-python
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          # The Dockerfile copies requirements.txt, scripts/, pathways/, and
          # harmonia/ from the repository root. The context has to be the root
          # or those COPY lines cannot see the files.
          context: .
          file: docker/pipeline/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/jonesnoaht/hu-rnmp-pipeline:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-browser-image:
    runs-on: ubuntu-latest
    needs: lint-python
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker/browser
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/jonesnoaht/hu-rnmp-browser:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
